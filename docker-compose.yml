services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_MONGODB_HOST: mongo
    depends_on:
      mongo:
        condition: service_healthy
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
